name: verify-model-benchmark-chat

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Self-test readable chat benchmark
        shell: pwsh
        run: node .\scripts\model_benchmark_chat.mjs self-test
