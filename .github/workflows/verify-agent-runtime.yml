name: verify-agent-runtime

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Show versions
        shell: pwsh
        run: |
          node --version
          git --version
          $PSVersionTable.PSVersion

      - name: Validate stable workspaces
        shell: pwsh
        run: node .\scripts\agent_runtime_stable.mjs validate

      - name: Verify local project context adapter
        shell: pwsh
        run: node .\scripts\verify_project_context.mjs self-test

      - name: Validate first real task template
        shell: pwsh
        run: node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('task-templates/current-logic-baseline-review.json','utf8')); if(x.schema!=='AgentTaskTemplate@1.0.0'||x.agentId!=='current-logic-analyst'||!Array.isArray(x.inputs)||x.inputs.length!==4) process.exit(1); console.log('TASK_TEMPLATE_PASS inputs='+x.inputs.length)"

      - name: Parse first real task launcher
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\RUN_FIRST_CURRENT_LOGIC_TASK.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Host; exit 1 }
          Write-Host 'RUN_FIRST_CURRENT_LOGIC_TASK_PARSE_PASS'

      - name: Parse approved MA state experiment launcher
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\RUN_APPROVED_MA_STATE_EXPERIMENT.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Host; exit 1 }
          Write-Host 'RUN_APPROVED_MA_STATE_EXPERIMENT_PARSE_PASS'

      - name: Verify autonomous research smoke scripts
        shell: pwsh
        run: |
          node --check .\scripts\autonomous_research_smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\RUN_AUTONOMOUS_RESEARCH_SMOKE.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Host; exit 1 }
          Write-Host 'AUTONOMOUS_RESEARCH_SMOKE_PARSE_PASS'

      - name: Verify after-hours research launchers
        shell: pwsh
        run: |
          foreach ($file in @('.\scripts\RUN_RESEARCH_WINDOW_ONCE.ps1','.\scripts\INSTALL_RESEARCH_NIGHT_TASK.ps1')) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Host; exit 1 }
          }
          Write-Host 'AFTER_HOURS_RESEARCH_LAUNCHERS_PARSE_PASS'

      - name: Verify semantic benchmark scorer
        shell: pwsh
        run: node .\scripts\model_benchmark_v2.mjs self-test

      - name: Smoke lifecycle through Windows PowerShell 5.1
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\VERIFY_AGENT_RUNTIME.ps1
