name: verify-agent-runtime

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Show versions
        shell: pwsh
        run: |
          node --version
          git --version
          $PSVersionTable.PSVersion

      - name: Validate stable workspaces
        shell: pwsh
        run: node .\scripts\agent_runtime_stable.mjs validate

      - name: Verify local project context adapter
        shell: pwsh
        run: node .\scripts\verify_project_context.mjs self-test

      - name: Validate first real task template
        shell: pwsh
        run: node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('task-templates/current-logic-baseline-review.json','utf8')); if(x.schema!=='AgentTaskTemplate@1.0.0'||x.agentId!=='current-logic-analyst'||!Array.isArray(x.inputs)||x.inputs.length!==4) process.exit(1); console.log('TASK_TEMPLATE_PASS inputs='+x.inputs.length)"

      - name: Validate next trigger architecture template
        shell: pwsh
        run: |
          node --check .\scripts\verify_feature_design_contract.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .\scripts\verify_feature_design_contract.mjs --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -e "const fs=require('fs');const v1=JSON.parse(fs.readFileSync('task-templates/feature-architect-next-trigger.json','utf8'));const v2=JSON.parse(fs.readFileSync('task-templates/feature-architect-next-trigger-v2.json','utf8'));const v3=JSON.parse(fs.readFileSync('task-templates/feature-architect-next-trigger-v3.json','utf8'));const v4=JSON.parse(fs.readFileSync('task-templates/feature-architect-next-trigger-v4.json','utf8'));if(v1.schema!=='AgentTaskTemplate@1.0.0'||v1.goalId!=='GOAL-FEATURE-ARCHITECT-NEXT-TRIGGER-001')process.exit(1);if(v2.schema!=='AgentTaskTemplate@1.0.0'||v2.goalId!=='GOAL-FEATURE-ARCHITECT-NEXT-TRIGGER-002')process.exit(1);if(v3.schema!=='AgentTaskTemplate@1.0.0'||v3.goalId!=='GOAL-FEATURE-ARCHITECT-NEXT-TRIGGER-003')process.exit(1);if(v4.schema!=='AgentTaskTemplate@1.0.0'||v4.agentId!=='feature-architect'||v4.goalId!=='GOAL-FEATURE-ARCHITECT-NEXT-TRIGGER-004'||!Array.isArray(v4.inputs)||v4.inputs.length!==6)process.exit(1);const roots=v4.inputs.map(x=>x.root);if(roots.filter(x=>x==='AGENT_REPO_ROOT').length!==2)process.exit(1);console.log('FEATURE_ARCHITECT_NEXT_TRIGGER_V4_TEMPLATE_PASS inputs='+v4.inputs.length)"

      - name: Verify queue guard and production autonomous queue lane
        shell: pwsh
        run: |
          node --check .\scripts\agent_queue_guard.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .\scripts\agent_queue_guard.mjs self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check .\scripts\autonomous_research_engine.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check .\scripts\agent_worker_router.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .\scripts\autonomous_research_engine.mjs --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .\scripts\agent_worker_router.mjs self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -e "const fs=require('fs');const smoke=JSON.parse(fs.readFileSync('task-templates/autonomous-ma5-queue-smoke.json','utf8'));const search=JSON.parse(fs.readFileSync('task-templates/autonomous-ma-period-search.json','utf8'));const discovery=JSON.parse(fs.readFileSync('task-templates/autonomous-high-breakout-discovery.json','utf8'));if(smoke.schema!=='AgentTaskTemplate@1.0.0'||smoke.executionMode!=='AUTONOMOUS_RESEARCH'||smoke.agentId!=='experiment-validation')process.exit(1);if(search.schema!=='AgentTaskTemplate@1.0.0'||search.executionMode!=='AUTONOMOUS_RESEARCH'||search.goalId!=='GOAL-AUTONOMOUS-MA-PERIOD-SEARCH-001')process.exit(1);if(discovery.schema!=='AgentTaskTemplate@1.0.0'||discovery.executionMode!=='AUTONOMOUS_RESEARCH'||discovery.goalId!=='GOAL-AUTONOMOUS-HIGH-BREAKOUT-DISCOVERY-001')process.exit(1);console.log('AUTONOMOUS_QUEUE_TEMPLATES_PASS')"

      - name: Parse first real task launcher
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\RUN_FIRST_CURRENT_LOGIC_TASK.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Host; exit 1 }
          Write-Host 'RUN_FIRST_CURRENT_LOGIC_TASK_PARSE_PASS'

      - name: Parse approved MA state experiment launcher
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\RUN_APPROVED_MA_STATE_EXPERIMENT.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Host; exit 1 }
          Write-Host 'RUN_APPROVED_MA_STATE_EXPERIMENT_PARSE_PASS'

      - name: Verify autonomous research smoke scripts
        shell: pwsh
        run: |
          node --check .\scripts\autonomous_research_smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\RUN_AUTONOMOUS_RESEARCH_SMOKE.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Host; exit 1 }
          Write-Host 'AUTONOMOUS_RESEARCH_SMOKE_PARSE_PASS'

      - name: Verify one-shot research launchers
        shell: pwsh
        run: |
          foreach ($file in @('.\scripts\RUN_AGENT_ONCE.ps1','.\scripts\RUN_RESEARCH_WINDOW_ONCE.ps1','.\scripts\RUN_AUTONOMOUS_QUEUE_SMOKE.ps1','.\scripts\RUN_AUTONOMOUS_MA_PERIOD_SEARCH.ps1','.\scripts\RUN_AUTONOMOUS_HIGH_BREAKOUT_DISCOVERY.ps1','.\scripts\RUN_FEATURE_ARCHITECT_NEXT_TRIGGER.ps1','.\scripts\INSTALL_RESEARCH_NIGHT_TASK.ps1')) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Host; exit 1 }
          }
          Write-Host 'ONE_SHOT_RESEARCH_LAUNCHERS_PARSE_PASS'

      - name: Verify semantic benchmark scorer
        shell: pwsh
        run: node .\scripts\model_benchmark_v2.mjs self-test

      - name: Smoke lifecycle through Windows PowerShell 5.1
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\VERIFY_AGENT_RUNTIME.ps1
